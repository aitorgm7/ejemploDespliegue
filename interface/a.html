<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIO</title>
    <link rel="stylesheet" href="a.css">
</head>
<body>
    <header>
        <h1>FORMULARIO</h1>
    </header>
    <main>
        <form action="" method="GET">
            <label for="asignatura">Asignaturas:</label>
            <br/>
            <label>
                <input type="radio" name="asignatura" value="INT"> INTERFACE
            </label>
            <br/>
            <label>
                <input type="radio" name="asignatura" value="CLI"> CLIENTE
            </label>
            <br/>
            <label>
                <input type="radio" name="asignatura" value="DES"> DESPLIEGUE
            </label>


            <br/><br/>
            <label for="nombre">Profesor:</label>
            <br/>
            <select name="profesor">
                <option value="">Isabel</option>
                <option value="">Alberto</option>
                <option value="">Ernesto</option>
                <option value="">Santiago</option>
            </select>
            <br/><br/>
            <label for="horas">Horas:</label>
            <br/>
            <input type="text" name="hora" id="hora">
            <br/><br/>
            <label for="informacion">Información:</label>
            <br/>
            <textarea name="informacion" id="informacion"></textarea>
            <br/><br/>
            <input type="submit" value="Enviar">
        </form>
    </main>


   
</body>
</html>
